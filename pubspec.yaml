name: authoros_language
description: >-
  The shared AuthorOS language layer: how a character is worded and how an
  author's free text is read. Rule-based, deterministic and on-device, behind
  interfaces a model-backed implementation could replace. Pure Dart. AOS
  Companion depends on it; applications that want characters in their own voice
  can too, and none of them copies it.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.12.0

dependencies:
  # The shared AuthorOS core, pinned by commit the way every application pins it.
  authoros_core:
    git:
      url: https://github.com/Ink-Insight-Software/authoros-core.git
      ref: 8626345b9d4479e8971a0839437e90bbc29d71a8 # 0.9.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.0
